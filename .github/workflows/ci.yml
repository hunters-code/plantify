name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint on plantify_apps
      run: |
        cd src/plantify_apps
        npm ci
        npm run lint
        
    - name: Run ESLint on plantify_admin
      run: |
        cd src/plantify_admin
        npm ci
        npm run lint
        
    - name: Check Prettier formatting on plantify_apps
      run: |
        cd src/plantify_apps
        npm run format:check
        
    - name: Check Prettier formatting on plantify_admin
      run: |
        cd src/plantify_admin
        npm run format:check

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check plantify_apps
      run: |
        cd src/plantify_apps
        npm ci
        npm run type-check
        
    - name: Type check plantify_admin
      run: |
        cd src/plantify_admin
        npm ci
        npx tsc --noEmit

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build plantify_apps
      run: |
        cd src/plantify_apps
        npm ci
        npm run build
        
    - name: Build plantify_admin
      run: |
        cd src/plantify_admin
        npm ci
        npm run build
        
    - name: Build plantify_frontend
      run: |
        cd src/plantify_frontend
        npm ci
        npm run build

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      continue-on-error: true
